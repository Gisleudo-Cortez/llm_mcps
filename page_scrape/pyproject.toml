[project]
name = "page-scrape"
version = "0.2.0"
description = "MCP tool to fetch and scrape URL content with anti-bot evasion"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=2.0.0",
    "curl-cffi>=0.15.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
