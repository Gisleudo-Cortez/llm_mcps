[project]
name = "email-management-mcp"
version = "0.1.0"
description = "MCP server for email classification, attachment routing, and inbox processing using himalaya + local LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.27.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
