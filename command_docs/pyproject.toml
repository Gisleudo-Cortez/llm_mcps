readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.27.0",
    "pydantic>=2.13.3",
    "requests>=2.33.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
