[project]
name = "python-browse-mcp"
version = "0.1.0"
description = "MCP server wrapping python-browse — terminal browser automation for AI agents"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "nodriver>=0.50.3",
    "websockets>=12.0",
]

# The python_browse package is vendored in ./python_browse (path-agnostic —
# no machine-specific paths). It is importable from the server dir.
