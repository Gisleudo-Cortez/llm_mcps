[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-art-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "ollama>=0.4.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

# The ascii_art package is vendored in ./ascii_art (path-agnostic —
# no machine-specific paths). It is importable from the server dir.
